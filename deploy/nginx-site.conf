# nginx site for mchannel-sync: only the booking webhook is public.
# install.sh copies this to
# /etc/nginx/sites-available/mchannel-sync.conf with __DOMAIN__ and __PORT__
# filled in, then certbot adds the HTTPS part.

server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 10m;

    # Booking webhooks from M-Channel. The body must reach the app unchanged
    # (the signature is computed over the raw bytes); nginx does not alter it.
    location /mchannel/webhook/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
